<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Sign in to your account or create a new account."
    >

    <title>Login and Registration</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="form.css">

    <!-- Boxicons -->
    <link
        rel="stylesheet"
        href="[unpkg.com](https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css)"
    >
</head>

<body>
    <main class="container">
        <!-- Login form -->
        <section class="form-box login" aria-labelledby="login-title">
            <form id="login-form" action="#" method="post">
                <h1 id="login-title">Login</h1>

                <div class="input-box">
                    <label class="sr-only" for="login-username">
                        Username
                    </label>

                    <input
                        id="login-username"
                        name="username"
                        type="text"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >

                    <i class="bx bxs-user" aria-hidden="true"></i>
                </div>

                <div class="input-box">
                    <label class="sr-only" for="login-password">
                        Password
                    </label>

                    <input
                        id="login-password"
                        name="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <i class="bx bxs-lock-alt" aria-hidden="true"></i>
                </div>

                <button type="submit" class="btn">Login</button>

                <div class="logreg-link">
                    <p>
                        Don't have an account?
                        <button type="button" class="link-button register-link">
                            Sign up
                        </button>
                    </p>
                </div>
            </form>
        </section>

        <!-- Registration form -->
        <section class="form-box register" aria-labelledby="register-title">
            <form id="register-form" action="#" method="post">
                <h2 id="register-title">Create an account</h2>

                <div class="input-box">
                    <label class="sr-only" for="register-username">
                        Username
                    </label>

                    <input
                        id="register-username"
                        name="username"
                        type="text"
                        placeholder="Username"
                        autocomplete="username"
                        minlength="3"
                        required
                    >

                    <i class="bx bxs-user" aria-hidden="true"></i>
                </div>

                <div class="input-box">
                    <label class="sr-only" for="register-email">
                        Email address
                    </label>

                    <input
                        id="register-email"
                        name="email"
                        type="email"
                        placeholder="Email address"
                        autocomplete="email"
                        required
                    >

                    <i class="bx bxs-envelope" aria-hidden="true"></i>
                </div>

                <div class="input-box">
                    <label class="sr-only" for="register-password">
                        Password
                    </label>

                    <input
                        id="register-password"
                        name="password"
                        type="password"
                        placeholder="Password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <i class="bx bxs-lock-alt" aria-hidden="true"></i>
                </div>

                <button type="submit" class="btn">Register</button>

                <div class="logreg-link">
                    <p>
                        Already have an account?
                        <button type="button" class="link-button login-link">
                            Sign in
                        </button>
                    </p>
                </div>
            </form>
        </section>

        <!-- Login information -->
        <section class="info-text login" aria-hidden="true">
            <h2>Welcome back!</h2>
            <p>Enter your credentials to access your account.</p>
        </section>

        <!-- Registration information -->
        <section class="info-text register" aria-hidden="true">
            <h2>Welcome!</h2>
            <p>Create an account and take the next step toward your goals.</p>
        </section>

        <!-- Decorative animated backgrounds -->
        <div class="bg-animate" aria-hidden="true"></div>
        <div class="bg-animate2" aria-hidden="true"></div>
    </main>

    <script src="form.js" defer></script>
</body>
</html>

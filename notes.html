<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DayWise | Notes & Reminders</title><link rel="stylesheet" href="organizer.css"><link rel="stylesheet" href="theme.css"><script src="theme.js"></script></head>
<body><header class="module-header"><div class="brand"><h1>📝 DayWise Notes</h1></div><a class="dashboard-back-btn" href="dashboard.html"><span aria-hidden="true">&#8592;</span> Back to Dashboard</a></header>
<main class="module-shell"><section class="hero"><h2>Notes & Reminders</h2><p>Keep lecture notes, shift details, ideas, deadlines, and reminders together.</p></section>
<div class="module-grid"><section class="module-card"><h3>Add a note</h3><form id="noteForm" class="module-form"><input id="noteTitle" placeholder="Note title" required><textarea id="noteBody" placeholder="Write your note or reminder..." required></textarea><select id="noteCategory"><option>General</option><option>Study</option><option>Work</option><option>Event</option></select><input id="reminderDate" type="datetime-local"><button class="primary-btn" type="submit">Save Note</button></form></section>
<section class="module-card"><h3>Saved notes</h3><div id="noteList" class="item-list"></div></section></div></main><script src="auth-guard.js"></script><script src="notes.js"></script></body></html>

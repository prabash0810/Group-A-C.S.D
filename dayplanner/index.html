<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daywise - Daily Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Container -->
    <div class="planner-container">

        <!-- Header Section -->
        <header class="header">

            <div class="logo">
                <h1>📅 Daywise</h1>
                <p>Your Academic Daily Planner</p>
            </div>

            <div class="date-box">
                <p id="date">Monday, 3 August 2026</p>
                <p id="clock">12:00:00</p>
            </div>

        </header>


        <!-- Welcome Section -->
        <section class="welcome">

            <h2>
                Welcome Back 👋
            </h2>

            <p>
                Plan your day, complete your goals and stay productive.
            </p>

        </section>


        <!-- Task Input Section -->
        <section class="task-section">

            <h2>
                Today's Tasks
            </h2>


            <div class="task-input">

                <input 
                type="text" 
                placeholder="Enter your task..."
                id="taskInput">


                <button id="addTask">
                    Add Task
                </button>

            </div>


            <!-- Task List -->
            <div class="task-list" id="taskList">

                <!-- Tasks will appear here -->

            </div>


        </section>



        <!-- Progress Section -->
        <section class="progress-section">

            <h2>
                Daily Progress
            </h2>


            <div class="progress-bar">

                <div class="progress">

                </div>

            </div>



            <p>
                0% Completed
            </p>


        </section>



        <!-- Footer -->
        <footer>

            <p>
                © 2026 Daywise | Academic Planner
            </p>

        </footer>


    </div>



<script src="script.js"></script>



<div class="background-shapes">


    <span class="shape shape1"></span>

    <span class="shape shape2"></span>

    <span class="shape shape3"></span>


</div>

</body>

</html>

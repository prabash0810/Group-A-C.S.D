<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Events</title>
    <link rel="stylesheet" href="2nd%20events.css">
</head>
<body>
    <nav>
        <h1>LifeSync</h1>
        <a href="dashboard.html.html">Dashboard</a>
        <a href="2nd%20events.html">Events</a>
        <a href="2nd%20achievements.html">Achievements</a>
    </nav>

    <main>
        <h2>Your Events</h2>
        <p>Organise your upcoming events and never miss important moments.</p>

        <section class="event-form">
            <input type="text" id="eventName" placeholder="Enter event name">
            <input type="date" id="eventDate">
            <button onclick="addEvent()">Add Event</button>
        </section>

        <section>
            <h3>Upcoming Events</h3>
            <div id="eventList"></div>
        </section>
    </main>

    <script>
    document.addEventListener("DOMContentLoaded", displayEvents);

    function getStoredItems(key) {
        try {
            const storedValue = localStorage.getItem(key);
            const parsedValue = storedValue ? JSON.parse(storedValue) : [];
            return Array.isArray(parsedValue) ? parsedValue : [];
        } catch (error) {
            console.warn("Unable to read storage for " + key, error);
            return [];
        }
    }

    function saveStoredItems(key, items) {
        localStorage.setItem(key, JSON.stringify(items));
    }

    function addEvent() {
        const name = document.getElementById("eventName").value.trim();
        const date = document.getElementById("eventDate").value.trim();

        if (name === "" || date === "") {
            alert("Please enter event details");
            return;
        }

        const events = getStoredItems("events");
        const newEvent = {
            id: Date.now(),
            name: name,
            date: date,
            completed: false
        };

        events.push(newEvent);
        saveStoredItems("events", events);

        alert("Event Added Successfully!");
        document.getElementById("eventName").value = "";
        document.getElementById("eventDate").value = "";

        displayEvents();
    }

    function displayEvents() {
        const events = getStoredItems("events");
        const list = document.getElementById("eventList");

        list.innerHTML = "";

        if (events.length === 0) {
            list.innerHTML = "<p>No events added yet.</p>";
            return;
        }

        events.forEach(event => {
            const card = document.createElement("div");
            card.className = "event-card";
            card.innerHTML = `
                <h4>${event.name}</h4>
                <p>Date: ${event.date}</p>
                <p>Status: ${event.completed ? "Completed ✅" : "Pending ⏳"}</p>
                <button onclick="completeEvent(${event.id})">Complete</button>
                <button onclick="deleteEvent(${event.id})">Delete</button>
            `;
            list.appendChild(card);
        });
    }

    function completeEvent(id) {
        const events = getStoredItems("events").map(event => {
            if (event.id === id) {
                event.completed = true;
            }
            return event;
        });

        saveStoredItems("events", events);
        displayEvents();
    }

    function deleteEvent(id) {
        const events = getStoredItems("events").filter(event => event.id !== id);
        saveStoredItems("events", events);
        displayEvents();
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Achievements</title>
    <link rel="stylesheet" href="2ndachievements.css">
</head>
<body>
    <nav>
        <h1>LifeSync</h1>
        <div>
            <a href="dashboard.html.html">Dashboard</a>
            <a href="2nd%20events.html">Events</a>
            <a href="2nd%20achievements.html">Achievements</a>
        </div>
    </nav>

    <main>
        <h2>Your Achievements 🏆</h2>
        <p>Save your certificates, awards and personal goals.</p>

        <section class="achievement-form">
            <input type="text" id="achievementTitle" placeholder="Achievement title">
            <input type="text" id="achievementDescription" placeholder="Description">
            <button onclick="addAchievement()">Add Achievement</button>
        </section>

        <section>
            <h3>My Achievements</h3>
            <div id="achievementList"></div>
        </section>
    </main>

    <script>
    document.addEventListener("DOMContentLoaded", displayAchievements);

    function getStoredItems(key) {
        try {
            const storedValue = localStorage.getItem(key);
            const parsedValue = storedValue ? JSON.parse(storedValue) : [];
            return Array.isArray(parsedValue) ? parsedValue : [];
        } catch (error) {
            console.warn("Unable to read storage for " + key, error);
            return [];
        }
    }

    function saveStoredItems(key, items) {
        localStorage.setItem(key, JSON.stringify(items));
    }

    function addAchievement() {
        const title = document.getElementById("achievementTitle").value.trim();
        const description = document.getElementById("achievementDescription").value.trim();

        if (title === "" || description === "") {
            alert("Please enter achievement details");
            return;
        }

        const achievements = getStoredItems("achievements");
        const newAchievement = {
            id: Date.now(),
            title: title,
            description: description,
            completed: false
        };

        achievements.push(newAchievement);
        saveStoredItems("achievements", achievements);

        alert("Achievement Added Successfully!");
        document.getElementById("achievementTitle").value = "";
        document.getElementById("achievementDescription").value = "";

        displayAchievements();
    }

    function displayAchievements() {
        const achievements = getStoredItems("achievements");
        const list = document.getElementById("achievementList");

        list.innerHTML = "";

        if (achievements.length === 0) {
            list.innerHTML = "<p>No achievements added yet.</p>";
            return;
        }

        achievements.forEach(item => {
            const card = document.createElement("div");
            card.className = "achievement-card";
            card.innerHTML = `
                <h4>${item.title}</h4>
                <p>${item.description}</p>
                <p>Status: ${item.completed ? "Completed ✅" : "Pending ⏳"}</p>
                <button onclick="completeAchievement(${item.id})">Complete</button>
                <button onclick="deleteAchievement(${item.id})">Delete</button>
            `;
            list.appendChild(card);
        });
    }

    function completeAchievement(id) {
        const achievements = getStoredItems("achievements").map(item => {
            if (item.id === id) {
                item.completed = true;
            }
            return item;
        });

        saveStoredItems("achievements", achievements);
        displayAchievements();
    }

    function deleteAchievement(id) {
        const achievements = getStoredItems("achievements").filter(item => item.id !== id);
        saveStoredItems("achievements", achievements);
        displayAchievements();
    }
    </script>
</body>
</html>
